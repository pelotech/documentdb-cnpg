apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ddb-pg
spec:
  instances: 1
  imageName: __BASE__
  enableSuperuserAccess: true
  storage:
    size: 1Gi
  postgresql:
    shared_preload_libraries: [pg_cron, pg_documentdb_core, pg_documentdb]
    parameters:
      cron.database_name: postgres
      max_replication_slots: "10"
      max_wal_senders: "10"
    # documentdb opens an internal libpq connection back to itself (host=localhost,
    # no password) for create_collection/DDL; trust loopback so that self-connection
    # authenticates. Fine for an ephemeral single-instance verification cluster.
    pg_hba:
      - host all all 127.0.0.1/32 trust
      - host all all ::1/128 trust
    extensions:
      - name: documentdb
        image:
          reference: __EXT_IMAGE__
          pullPolicy: Never
        extension_control_path: [share]
        dynamic_library_path: [lib]
        ld_library_path: [lib, system]
  bootstrap:
    initdb:
      database: postgres
      postInitSQL:
        - "CREATE EXTENSION IF NOT EXISTS documentdb CASCADE;"
