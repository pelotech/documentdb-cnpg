name: _build

on:
  workflow_call:
    inputs:
      publish:
        description: push per-arch images and assemble manifests
        type: boolean
        default: false
      engine_ref:
        description: ref for the engine image tag (git-<sha> or a release version)
        type: string
        default: ""
      imagevol_ref:
        description: ref for the imagevol image tag
        type: string
        default: ""
      gateway_ref:
        description: ref for the gateway image tag
        type: string
        default: ""

jobs:
  check-pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./build/common/check-pins.sh

  build:
    needs: check-pins
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
        # KEEP this target set IN SYNC with the per-artifact build/<artifact>/pins.env
        # (ENGINE_PG_MAJORS in engine, IMAGEVOL_PG_MAJOR in imagevol).
        target:
          - { artifact: engine, pg: "17" }
          - { artifact: engine, pg: "18" }
          - { artifact: imagevol, pg: "18" }
        include:
          - { arch: arm64, runner: ubuntu-24.04-arm, experimental: false }
          - { arch: amd64, runner: ubuntu-24.04, experimental: true }
    name: ${{ matrix.target.artifact }}-pg${{ matrix.target.pg }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # amd64 is unproven; non-blocking (continue-on-error) until it has its own verify pass.
    continue-on-error: ${{ matrix.experimental }}
    env:
      IMAGE_TAG: ${{ matrix.target.artifact == 'engine' && inputs.engine_ref || inputs.imagevol_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load pins
        run: |
          set -euo pipefail
          set -a; source versions.env; source "build/${{ matrix.target.artifact }}/pins.env"; set +a
          : "${IMAGE_REPO:?set IMAGE_REPO in versions.env}"
          pg="${{ matrix.target.pg }}"; art="${{ matrix.target.artifact }}"
          base_var="HARDENED_BASE_${pg}"; : "${!base_var:?no base for PG ${pg}}"
          if [ "$art" = engine ]; then
            case " $ENGINE_PG_MAJORS " in *" $pg "*) : ;; *) echo "::error::engine pg $pg not in ENGINE_PG_MAJORS ($ENGINE_PG_MAJORS)"; exit 1 ;; esac
          else
            [ "$pg" = "$IMAGEVOL_PG_MAJOR" ] || { echo "::error::imagevol pg $pg != IMAGEVOL_PG_MAJOR ($IMAGEVOL_PG_MAJOR)"; exit 1; }
          fi
          {
            echo "PG_MAJOR=$pg"
            echo "ARTIFACT=$art"
            echo "HARDENED_BASE=${!base_var}"
            echo "LOCAL_IMAGE=$(ARTIFACT="$art" PG_MAJOR="$pg" REF=local ./build/common/image-tag.sh)"
          } >> "$GITHUB_ENV"

      # ICU-drift guard: the base has no shell, so export its filesystem and grep the
      # libicui18n soname from the tar listing. sort -u reads all input to avoid a
      # SIGPIPE from a short-circuiting grep under pipefail.
      - name: ICU-drift guard
        run: |
          set -euo pipefail
          set -a; source versions.env; source "build/${{ matrix.target.artifact }}/pins.env"; set +a
          cid="$(docker create "$HARDENED_BASE")"
          trap 'docker rm "$cid" >/dev/null 2>&1 || true' EXIT
          mapfile -t majors < <(docker export "$cid" | tar -t 2>/dev/null \
            | grep -oE 'libicui18n\.so\.[0-9]+' | grep -oE '[0-9]+$' | sort -u)
          got="${majors[0]:-}"
          if [ "${#majors[@]}" -ne 1 ] || [ "$got" != "$ICU_MAJOR" ]; then
            echo "::error::hardened base ICU '${majors[*]:-none}' != pinned $ICU_MAJOR; re-pin ICU_VERSION and rebuild"
            exit 1
          fi
          echo "ICU-drift guard OK: base ICU $got == pinned $ICU_MAJOR"

      - name: Build
        run: |
          if [ "$ARTIFACT" = engine ]; then
            TARGETARCH=${{ matrix.arch }} PG_MAJOR=${PG_MAJOR} ./build/engine/build-engine.sh
          else
            TARGETARCH=${{ matrix.arch }} PG_MAJOR=${PG_MAJOR} ./build/imagevol/build.sh
          fi

      # glibc guard: the max GLIBC_x.yy symbol in the built .so must be <= the base's
      # glibc, or the extension won't load. objdump output is captured to a variable
      # before grep to avoid a SIGPIPE from a short-circuiting grep under pipefail.
      - name: glibc guard
        run: |
          set -euo pipefail
          base="$(docker run --rm --entrypoint sh "$HARDENED_BASE" -c 'ldd --version | head -1 | grep -oE "[0-9]+\.[0-9]+$"')"
          tmp="$(mktemp -d)"
          dpkg-deb -x .work/deb-pg${PG_MAJOR}/*.deb "$tmp"
          so="$tmp/usr/lib/postgresql/${PG_MAJOR}/lib/pg_documentdb_core.so"
          syms="$(objdump -T "$so")"
          built="$(grep -oE 'GLIBC_[0-9]+\.[0-9]+' <<<"$syms" | sort -V | tail -1 | cut -d_ -f2)"
          echo "built glibc requirement: $built ; base glibc: $base"
          if [ "$(printf '%s\n%s\n' "$built" "$base" | sort -V | tail -1)" != "$base" ]; then
            echo "::error::built .so needs glibc $built > base $base; extension will not load"
            exit 1
          fi
          echo "glibc guard OK: built $built <= base $base"

      - name: Set up kind + kubectl + yq
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Verify
        run: |
          set -euo pipefail
          if [ "$ARTIFACT" = engine ]; then
            ENGINE_IMAGE="$LOCAL_IMAGE" KIND_EPHEMERAL=1 ./test/verify-engine.sh
          else
            EXT_IMAGE="$LOCAL_IMAGE" PG_MAJOR=${PG_MAJOR} KIND_EPHEMERAL=1 ./test/verify.sh
          fi

      - name: Publish per-arch image
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          pub="$(ARTIFACT="$ARTIFACT" PG_MAJOR="$PG_MAJOR" REF="$IMAGE_TAG" ./build/common/image-tag.sh)"
          docker tag "$LOCAL_IMAGE" "${pub}-${{ matrix.arch }}"
          docker push "${pub}-${{ matrix.arch }}"
          echo "published ${pub}-${{ matrix.arch }}"

  # The gateway is a different kind of artifact from engine/imagevol: PG- and
  # ICU-agnostic, compiled from Rust (no .deb), verified with readelf + docker run
  # (no cluster). It gets its own job rather than conditionals in the matrix above.
  gateway-build:
    needs: check-pins
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
        include:
          - { arch: arm64, runner: ubuntu-24.04-arm, experimental: false }
          - { arch: amd64, runner: ubuntu-24.04, experimental: true }
    name: gateway-build-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    env:
      IMAGE_TAG: ${{ inputs.gateway_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: TARGETARCH=${{ matrix.arch }} ./build/gateway/build-gateway.sh

      # FIPS linkage (readelf NEEDED libssl/libcrypto) and that the binary runs on
      # the base. The mongosh round-trip is the gateway-e2e job.
      - name: Verify
        run: REF=local ./test/verify-gateway.sh

      - name: Publish per-arch image
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          local_image="$(ARTIFACT=gateway REF=local ./build/common/image-tag.sh)"
          pub="$(ARTIFACT=gateway REF="$IMAGE_TAG" ./build/common/image-tag.sh)"
          docker tag "$local_image" "${pub}-${{ matrix.arch }}"
          docker push "${pub}-${{ matrix.arch }}"
          echo "published ${pub}-${{ matrix.arch }}"

  gateway-e2e:
    name: gateway-e2e (mongosh round-trip)
    needs: [build, gateway-build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm   # native arm64; the build is proven on arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build engine + gateway (local)
        run: |
          set -euo pipefail
          TARGETARCH=arm64 PG_MAJOR=18 ./build/engine/build-engine.sh
          TARGETARCH=arm64 ./build/gateway/build-gateway.sh
      - name: Set up kind + kubectl
        uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Install mongosh
        run: |
          set -euo pipefail
          curl -fsSL https://pgp.mongodb.com/server-8.0.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/mongodb.gpg
          echo "deb [arch=arm64 signed-by=/usr/share/keyrings/mongodb.gpg] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb.list >/dev/null
          sudo apt-get update && sudo apt-get install -y mongodb-mongosh
      - name: Gateway e2e (mongosh insert/find over TLS+SCRAM)
        run: |
          set -euo pipefail
          ENGINE_IMAGE="$(ARTIFACT=engine PG_MAJOR=18 REF=local ./build/common/image-tag.sh)"
          GW_IMAGE="$(ARTIFACT=gateway REF=local ./build/common/image-tag.sh)"
          ENGINE_IMAGE="$ENGINE_IMAGE" GW_IMAGE="$GW_IMAGE" ./test/e2e-gateway.sh

  manifest:
    if: ${{ inputs.publish && !cancelled() }}
    needs: [build, gateway-build]
    runs-on: ubuntu-24.04
    env:
      ENGINE_REF: ${{ inputs.engine_ref }}
      IMAGEVOL_REF: ${{ inputs.imagevol_ref }}
      GATEWAY_REF: ${{ inputs.gateway_ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble per-artifact manifest lists
        run: |
          set -euo pipefail
          set -a; source build/engine/pins.env; source build/imagevol/pins.env; set +a
          overall=0
          assemble() {
            local ref
            case "$1" in engine) ref="$ENGINE_REF" ;; imagevol) ref="$IMAGEVOL_REF" ;; gateway) ref="$GATEWAY_REF" ;; esac
            local image; image="$(ARTIFACT="$1" PG_MAJOR="$2" REF="$ref" ./build/common/image-tag.sh)"
            local refs=()
            for arch in arm64 amd64; do
              if docker manifest inspect "${image}-${arch}" >/dev/null 2>&1; then refs+=("${image}-${arch}");
              else echo "note: ${image}-${arch} not published"; fi
            done
            local have_arm64=0
            for r in "${refs[@]:-}"; do [ "${r##*-}" = arm64 ] && have_arm64=1; done
            if [ "$have_arm64" != 1 ]; then echo "::error::${image}: required arm64 missing"; overall=1; return; fi
            if ! docker manifest create "$image" "${refs[@]}"; then echo "::error::${image}: create failed"; overall=1; return; fi
            if ! docker manifest push "$image"; then echo "::error::${image}: push failed"; overall=1; return; fi
            echo "published manifest $image -> ${refs[*]}"
          }
          for m in $ENGINE_PG_MAJORS; do assemble engine "$m"; done
          assemble imagevol "$IMAGEVOL_PG_MAJOR"
          assemble gateway "$IMAGEVOL_PG_MAJOR"   # pg arg unused for gateway (PG-agnostic tag)
          exit $overall
