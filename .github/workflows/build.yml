name: build

# Triggers: source/pin changes on push, PR validation, a manual run, and a
# scheduled base-digest drift check (the ICU-drift guard is the early warning
# for a Minimus ICU bump).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly: re-run the guards + verify against the pinned base

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # push the built image to GHCR on green

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            experimental: false   # proven end-to-end
          - arch: amd64
            runner: ubuntu-24.04
            experimental: true    # unproven: ICU-77 source build, multiarch triplet, /system all need revalidation
    name: build-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # amd64 is non-blocking until its own verify gate is green (see spec section 5).
    continue-on-error: ${{ matrix.experimental }}
    # Mapped here because the `secrets` context is not allowed in step `if:` conditions.
    env:
      MINIMUS_REGISTRY: ${{ secrets.MINIMUS_REGISTRY }}
    steps:
      - uses: actions/checkout@v4

      - name: Load pinned inputs from versions.env
        run: |
          set -euo pipefail
          set -a; source versions.env; set +a
          : "${IMAGE_REPO:?set IMAGE_REPO in versions.env}"
          {
            echo "DOCUMENTDB_TAG=$DOCUMENTDB_TAG"
            echo "ICU_VERSION=$ICU_VERSION"
            echo "ICU_MAJOR=$ICU_MAJOR"
            echo "PG_MAJOR=$PG_MAJOR"
            echo "HARDENED_BASE=$HARDENED_BASE"
            echo "IMAGE_REPO=$IMAGE_REPO"
            echo "IMAGE=${IMAGE_REPO}:${DOCUMENTDB_TAG#v}-icu${ICU_MAJOR}"
          } >> "$GITHUB_ENV"

      # Registry login is required to read the hardened base (ICU-drift/glibc guards)
      # and to push the built image. Provide MINIMUS_REGISTRY/_USER/_TOKEN secrets for
      # the private base; GHCR uses the built-in token.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to hardened-base registry
        if: ${{ env.MINIMUS_REGISTRY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.MINIMUS_REGISTRY }}
          username: ${{ secrets.MINIMUS_USER }}
          password: ${{ secrets.MINIMUS_TOKEN }}

      # ICU-drift guard (fails loud). Shell-free w.r.t. the base: export its filesystem
      # and read the libicui18n soname; do not assume the base has a shell.
      # NB: the reducing step (sort -u) consumes all input — no head/grep -q short-circuit,
      # which under pipefail would SIGPIPE the producer and fail spuriously.
      - name: ICU-drift guard
        run: |
          set -euo pipefail
          cid="$(docker create "$HARDENED_BASE")"
          trap 'docker rm "$cid" >/dev/null 2>&1 || true' EXIT
          mapfile -t majors < <(docker export "$cid" | tar -t 2>/dev/null \
            | grep -oE 'libicui18n\.so\.[0-9]+' | grep -oE '[0-9]+$' | sort -u)
          got="${majors[0]:-}"
          if [ "${#majors[@]}" -ne 1 ] || [ "$got" != "$ICU_MAJOR" ]; then
            echo "::error::hardened base ICU '${majors[*]:-none}' != pinned $ICU_MAJOR — re-pin ICU_VERSION and rebuild"
            exit 1
          fi
          echo "ICU-drift guard OK: base ICU $got == pinned $ICU_MAJOR"

      - name: Build (Stage A .deb + Stage B ImageVolume image)
        run: TARGETARCH=${{ matrix.arch }} ./build/build.sh

      # glibc guard (fails loud): the max GLIBC_x.yy symbol in the built .so must be
      # <= the base's glibc. objdump output is captured to a variable before grep so a
      # short-circuiting grep can't SIGPIPE it under pipefail.
      - name: glibc guard
        run: |
          set -euo pipefail
          base="$(docker run --rm --entrypoint sh "$HARDENED_BASE" -c 'ldd --version | head -1 | grep -oE "[0-9]+\.[0-9]+$"')"
          tmp="$(mktemp -d)"
          dpkg-deb -x .work/deb/*.deb "$tmp"
          so="$tmp/usr/lib/postgresql/${PG_MAJOR}/lib/pg_documentdb_core.so"
          syms="$(objdump -T "$so")"
          built="$(grep -oE 'GLIBC_[0-9]+\.[0-9]+' <<<"$syms" | sort -V | tail -1 | cut -d_ -f2)"
          echo "built glibc requirement: $built ; base glibc: $base"
          if [ "$(printf '%s\n%s\n' "$built" "$base" | sort -V | tail -1)" != "$base" ]; then
            echo "::error::built .so needs glibc $built > base $base — extension will not load"
            exit 1
          fi
          echo "glibc guard OK: built $built <= base $base"

      - name: Set up kind + kubectl + yq
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Verify (CNPG load + CREATE EXTENSION + smoke)
        run: |
          set -euo pipefail
          EXT_IMAGE="$IMAGE" KIND_EPHEMERAL=1 ./test/verify.sh

      - name: Publish on green
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          docker tag "$IMAGE" "${IMAGE}-${{ matrix.arch }}"
          docker push "${IMAGE}-${{ matrix.arch }}"
          echo "published ${IMAGE}-${{ matrix.arch }}"

  # Assemble the multi-arch manifest from the per-arch tags that published. arm64 is
  # required; amd64 is folded in only if its (non-blocking) job published a tag.
  manifest:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Load pins
        run: |
          set -euo pipefail
          set -a; source versions.env; set +a
          echo "IMAGE=${IMAGE_REPO}:${DOCUMENTDB_TAG#v}-icu${ICU_MAJOR}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest list
        run: |
          set -euo pipefail
          refs=()
          for arch in arm64 amd64; do
            if docker manifest inspect "${IMAGE}-${arch}" >/dev/null 2>&1; then
              refs+=("${IMAGE}-${arch}")
            else
              echo "note: ${IMAGE}-${arch} not published (arch skipped or its gate was not green)"
            fi
          done
          [ "${#refs[@]}" -ge 1 ] || { echo "::error::no per-arch images published"; exit 1; }
          docker manifest create "$IMAGE" "${refs[@]}"
          docker manifest push "$IMAGE"
          echo "published manifest $IMAGE -> ${refs[*]}"
