name: main

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

jobs:
  # Early warning that the vendor moved a fips:NN tag off the digest we pinned.
  # Fails the run so a re-pin is visible; does not gate the build (we intentionally
  # keep building the pinned digest until re-pinned).
  base-drift:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare pinned base digests to the live tags
        run: |
          set -euo pipefail
          set -a; source build/engine/pins.env; source build/imagevol/pins.env; set +a
          drift=0
          for m in $(printf '%s\n' $ENGINE_PG_MAJORS "$IMAGEVOL_PG_MAJOR" | sort -u); do
            var="HARDENED_BASE_$m"; ref="${!var}"
            repo="${ref%@*}"; pinned="${ref#*@}"
            live="$(docker buildx imagetools inspect "$repo" 2>/dev/null | awk '/^Digest:/{print $2; exit}')"
            if [ -z "$live" ]; then echo "::warning::could not resolve $repo"; continue; fi
            if [ "$live" != "$pinned" ]; then
              echo "::error::$repo moved: pinned $pinned, live $live; re-pin HARDENED_BASE_$m and rebuild"
              drift=1
            else
              echo "$repo OK ($pinned)"
            fi
          done
          exit $drift

  # No releases on scheduled runs (nothing new to release).
  release-please:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      engine_ref: ${{ steps.refs.outputs.engine_ref }}
      imagevol_ref: ${{ steps.refs.outputs.imagevol_ref }}
      gateway_ref: ${{ steps.refs.outputs.gateway_ref }}
      chart_version: ${{ steps.refs.outputs.chart_version }}
      chart_released: ${{ steps.refs.outputs.chart_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v4
      - id: refs
        env:
          ENGINE_CREATED: ${{ steps.release.outputs['build/engine--release_created'] }}
          ENGINE_VERSION: ${{ steps.release.outputs['build/engine--version'] }}
          IMAGEVOL_CREATED: ${{ steps.release.outputs['build/imagevol--release_created'] }}
          IMAGEVOL_VERSION: ${{ steps.release.outputs['build/imagevol--version'] }}
          GATEWAY_CREATED: ${{ steps.release.outputs['build/gateway--release_created'] }}
          GATEWAY_VERSION: ${{ steps.release.outputs['build/gateway--version'] }}
          CHART_CREATED: ${{ steps.release.outputs['charts/documentdb-gw--release_created'] }}
          CHART_VERSION: ${{ steps.release.outputs['charts/documentdb-gw--version'] }}
        run: |
          set -euo pipefail
          sha="git-$(git rev-parse --short HEAD)"
          emit() { if [ "$1" = "true" ]; then echo "$3=$2"; else echo "$3=$sha"; fi; }
          {
            emit "$ENGINE_CREATED"   "$ENGINE_VERSION"   engine_ref
            emit "$IMAGEVOL_CREATED" "$IMAGEVOL_VERSION" imagevol_ref
            emit "$GATEWAY_CREATED"  "$GATEWAY_VERSION"  gateway_ref
            echo "chart_released=${CHART_CREATED:-false}"
            echo "chart_version=${CHART_VERSION}"
          } >> "$GITHUB_OUTPUT"

  # push / workflow_dispatch build and publish; scheduled runs build and verify only.
  build:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.result == 'success' || needs.release-please.result == 'skipped') }}
    uses: ./.github/workflows/_build.yaml
    permissions:
      contents: read
      packages: write
    with:
      publish: ${{ github.event_name != 'schedule' }}
      engine_ref: ${{ needs.release-please.outputs.engine_ref }}
      imagevol_ref: ${{ needs.release-please.outputs.imagevol_ref }}
      gateway_ref: ${{ needs.release-please.outputs.gateway_ref }}
      chart_version: ${{ needs.release-please.outputs.chart_version }}
      chart_released: ${{ needs.release-please.outputs.chart_released == 'true' }}
