apiVersion: v2
name: documentdb-gw
description: MongoDB-wire DocumentDB gateway for CloudNativePG, with an optional
  ImageVolume cluster
type: application
version: 0.1.2
# The gateway release version, auto-bumped by release-please (build/gateway extra-files).
# image.tag composes the full tag as "<image.documentdbVersion>-<appVersion>".
appVersion: "0.1.3" # x-release-please-version
# No global kubeVersion: the k8s >= 1.35 (ImageVolume) requirement applies only to
# cluster.create=true and is enforced conditionally by the chart (see _helpers.tpl).
home: https://github.com/pelotech/documentdb-cnpg
sources:
  - https://github.com/pelotech/documentdb-cnpg
maintainers:
  - name: pelotech
