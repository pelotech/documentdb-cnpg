{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "documentdb-gw.fullname" . }}
  labels:
    {{- include "documentdb-gw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "documentdb-gw.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # MongoDB clients -> gateway listener. Narrow `from` via networkPolicy.clientNamespaceSelector.
    - ports:
        - port: 10260
          protocol: TCP
      {{- with .Values.networkPolicy.clientNamespaceSelector }}
      from:
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
      {{- end }}
  egress:
    # Gateway -> CNPG Postgres pods on 5432. CNPG labels its instance pods with
    # `cnpg.io/cluster: <cluster>`; this reaches every instance (the -rw Service
    # routes to the primary, but egress is enforced at the pod level).
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.cluster.name }}
      ports:
        - port: 5432
          protocol: TCP
    # DNS resolution for the -rw Service name.
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
